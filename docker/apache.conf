<VirtualHost *:80>
    ServerName www.ubaada.com
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    LimitRequestBody 33554432

    # Only Caddy's isolated Docker network may supply forwarding headers.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 172.30.0.0/24
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        AllowOverride None
        Options -Indexes -ExecCGI
        Require all granted
        RewriteEngine On
        RewriteRule ^post/([A-Za-z0-9]+)$ post.php?key=$1 [END]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}.php -f
        RewriteRule ^(.+)$ $1.php [END]
    </Directory>

    RedirectMatch 301 ^/cms/images/(.*)$ /cms/post_files/$1
    <Directory /var/www/html/cms/post_files>
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|sh)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>
    <FilesMatch "^(\.|Dockerfile)">
        Require all denied
    </FilesMatch>
</VirtualHost>
